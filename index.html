<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Google Sheet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f6f8; }
    h1 { font-size: 1.4rem; }
    #status { color: #666; font-size: 0.85rem; margin-bottom: 10px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
    th { background: #2d6cdf; color: #fff; }
    tr:nth-child(even) { background: #f9f9f9; }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Live Google Sheet Data</h1>
  <div id="status">Loading...</div>
  <div class="wrap"><table id="data"></table></div>

  <script>
    // ====== EDIT THESE TWO LINES ======
    const SHEET_ID  = "191KKB7bhhMGN_Y6YUFRgryHpMltASwDNDfP_gIWnm24";  // the long ID in the sheet URL
    const SHEET_TAB = "Sheet1";                     // exact name of the tab
    const REFRESH_SECONDS = 30;                     // auto-refresh interval
    // ==================================

    const URL_CSV =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;

    // Small CSV parser (handles quotes and commas inside cells)
    function parseCSV(text) {
      const rows = []; let row = [], cell = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (inQuotes) {
          if (c === '"' && n === '"') { cell += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else cell += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && n === "\n") i++;
          row.push(cell); rows.push(row); row = []; cell = "";
        } else cell += c;
      }
      if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    function render(rows) {
      const table = document.getElementById("data");
      table.innerHTML = "";
      rows.forEach((r, i) => {
        const tr = document.createElement("tr");
        r.forEach(v => {
          const td = document.createElement(i === 0 ? "th" : "td");
          td.textContent = v;          // textContent = safe from HTML injection
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    async function load() {
      const status = document.getElementById("status");
      try {
        const res = await fetch(URL_CSV, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(parseCSV(await res.text()));
        status.textContent = "Last updated: " + new Date().toLocaleTimeString();
      } catch (e) {
        status.textContent = "Could not load sheet. Check the Sheet ID, tab name and sharing. (" + e.message + ")";
      }
    }

    load();
    setInterval(load, REFRESH_SECONDS * 1000);
  </script>
</body>
</html>
